name: mester_plus
description: Mester+ — árajánlat- és projektkezelő magyar szakiknak. Offline-first.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  # PDF árajánlat készítése, megosztása, nyomtatása
  pdf: ^3.11.1
  printing: ^5.13.4
  # Ügyfél hívása / e-mail egy koppintással
  url_launcher: ^6.3.1
  # Biztonsági mentés: mentési fájl helyének kiválasztása és visszaállításhoz fájl megnyitása
  # 8.1.7 – 10.x: a feloldó a gépeden lévő Flutterrel kompatibilis legújabbat választja
  file_picker: '>=8.1.7 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  # Csak a DB-tesztekhez (natív SQLite elérhetőségének ellenőrzése).
  sqlite3: ^2.4.0
  # App-ikon és indítóképernyő generálása (Android adaptív + monokróm ikon, Android 12+ splash)
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

# ── Ikon: dart run flutter_launcher_icons ─────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  # Csak Android (Play Áruház). iOS-hez: ios: true + remove_alpha_ios: true, és `flutter create --platforms ios`.
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1B2B44"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_foreground.png"

# ── Indítóképernyő: dart run flutter_native_splash:create ─────────────────
flutter_native_splash:
  color: "#1B2B44"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#1B2B44"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#1B2B44"
  ios: false
  web: false

; Karikagyuru bemutató (V5.10) – PHP-FPM alatt a mappára érvényes beállítás (Apache mod_php alatt hatástalan).
; A 8 MB-os fotókhoz és a 3 képes ajánlatkéréshez kell; az alapértelmezett 2 MB kevés.
upload_max_filesize = 10M
post_max_size = 32M
memory_limit = 256M
max_file_uploads = 12
session.cookie_httponly = 1
session.use_strict_mode = 1
expose_php = 0

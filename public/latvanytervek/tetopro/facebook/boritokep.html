<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_alap.css"><style>
body{width:1640px;height:624px;position:relative;overflow:hidden;background:#0E1215}
.kepek{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.kepek img{width:100%;height:100%;object-fit:cover}
.kepek img:nth-child(1){object-position:50% 60%}
.kepek img:nth-child(2){object-position:50% 70%}
.fedo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,21,.92) 0%,rgba(14,18,21,.72) 34%,rgba(14,18,21,.15) 62%,rgba(14,18,21,.35) 100%)}
.szoveg{position:absolute;left:0;right:0;top:48px;text-align:center}
.tetovonal{display:block;margin:0 auto 18px;width:92px;height:24px;background:linear-gradient(180deg,#FFC94A,#E39E07);clip-path:polygon(0 100%,50% 0,100% 100%,84% 100%,50% 30%,16% 100%)}
h1{font-size:86px;line-height:1;letter-spacing:.01em;background:linear-gradient(180deg,#F2F4F6,#A9B1B9);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{background:linear-gradient(180deg,#FFC94A,#E39E07);-webkit-background-clip:text;background-clip:text;color:transparent}
.sor{margin-top:20px;display:flex;justify-content:center;gap:16px;align-items:center;font-size:30px;font-weight:600;color:#E2E6E9}
.sor i{width:7px;height:7px;background:#F5B21B;transform:rotate(45deg)}
.sor b{font-stretch:75%;font-weight:900;font-size:38px;letter-spacing:.02em}
</style>

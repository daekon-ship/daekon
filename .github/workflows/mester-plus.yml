name: Mester+ app (Flutter) ellenőrzés

# Valódi fordítás és tesztek minden változásnál: kódgenerálás, statikus elemzés,
# unit + adatbázis-tesztek, majd egy Android App Bundle build (debug-aláírással,
# csak ellenőrzéshez — a Play-be feltöltendő, aláírt AAB-t a release.bat készíti).
on:
  push:
    branches: [master]
    paths:
      - "apps/mester-plus/**"
      - ".github/workflows/mester-plus.yml"
  pull_request:
    paths:
      - "apps/mester-plus/**"
      - ".github/workflows/mester-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mester-plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mester-plus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.x"
          cache: true

      - name: Natív SQLite a DB-tesztekhez
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - name: Flutter verzió
        run: flutter --version

      - name: Android projekt létrehozása
        run: |
          tool/ci_step.sh "flutter create" flutter create . --project-name mester_plus --org hu.mesterplus --platforms android
          rm -f test/widget_test.dart

      - name: Csomagok
        run: tool/ci_step.sh "Csomagok" flutter pub get

      - name: Adatbázis-kód generálása (Drift)
        run: tool/ci_step.sh "Drift" dart run build_runner build --delete-conflicting-outputs --force-jit

      - name: Ikon és indítóképernyő
        run: |
          tool/ci_step.sh "Ikon" dart run flutter_launcher_icons
          tool/ci_step.sh "Splash" dart run flutter_native_splash:create

      - name: Android kiadási beállítások (név, API 36, aláírás)
        run: tool/ci_step.sh "Android beállítás" dart run tool/android_release_setup.dart

      - name: Statikus elemzés
        run: tool/ci_step.sh "Analyze" flutter analyze --no-fatal-infos

      - name: Tesztek
        run: tool/ci_step.sh "Tesztek" flutter test --reporter expanded

      - name: Android App Bundle build
        run: tool/ci_step.sh "AAB build" flutter build appbundle --release

      - name: Biztonsági ellenőrzések a kész csomagon
        run: |
          set -e
          grep -q 'maxOf(flutter.targetSdkVersion, 36)' android/app/build.gradle.kts
          grep -q 'android:label="Mester+"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          # A kész AAB-ban: nincs INTERNET engedély a release manifestben, és SQLCipher van a natív libek közt.
          unzip -o -q build/app/outputs/bundle/release/app-release.aab -d /tmp/aab
          ls /tmp/aab/base/lib/arm64-v8a/ | tee /tmp/libs.txt
          grep -q 'libsqlite3.so\|libsqlcipher' /tmp/libs.txt
          ! (strings /tmp/aab/base/manifest/AndroidManifest.xml | grep -q 'android.permission.INTERNET') || (echo 'INTERNET engedély a release manifestben!' && exit 1)
          # 16 KB oldalméret: minden natív .so 16 KB-ra igazított LOAD szegmenssel
          for so in /tmp/aab/base/lib/arm64-v8a/*.so; do
            align=$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u | head -1)
            echo "$so align=$align"
            case "$align" in 0x4000|0x10000) ;; *) echo "Nem 16 KB-igazított: $so ($align)"; exit 1;; esac
          done
          ls -la build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mester-plus-aab-ellenorzo-build
          path: apps/mester-plus/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # Ismert sérülékenységek a felhasznált csomagokban (OSV adatbázis).
  deps-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mester-plus
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.x"
          cache: true
      - run: flutter pub get
      - name: Elavult csomagok (tájékoztató)
        run: flutter pub outdated || true
      - name: OSV sérülékenység-keresés a pubspec.lock-on
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=pubspec.lock

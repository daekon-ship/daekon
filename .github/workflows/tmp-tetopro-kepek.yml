name: tmp-tetopro-kepek
on:
  push:
    branches: [tmp-tetopro-kepek]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Screenshots
        run: |
          mkdir -p _ref && cd _ref
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const sites = process.argv.slice(2);
          (async () => {
            const b = await chromium.launch();
            for (const s of sites) {
              const [name, url] = s.split('=');
              for (const [tag, vp, mob] of [['d', {width:1440,height:900}, false], ['m', {width:390,height:844}, true]]) {
                const ctx = await b.newContext({ viewport: vp, isMobile: mob, deviceScaleFactor: 1, locale: 'en-US', userAgent: mob ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1' : undefined });
                const p = await ctx.newPage();
                try {
                  await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await p.waitForTimeout(5000);
                  for (const sel of ['#onetrust-accept-btn-handler','button:has-text("Accept")','button:has-text("Accept all")','button:has-text("Alle akzeptieren")','button:has-text("Akzeptieren")','button:has-text("I agree")','button:has-text("Allow all")']) { try { await p.click(sel, { timeout: 800 }); break; } catch (e) {} }
                  await p.waitForTimeout(1200);
                  const H = await p.evaluate(() => document.documentElement.scrollHeight);
                  for (let y = 0; y < Math.min(H, 9000); y += 500) { await p.evaluate(v => window.scrollTo(0, v), y); await p.waitForTimeout(250); }
                  await p.evaluate(() => window.scrollTo(0, 0)); await p.waitForTimeout(1500);
                  await p.screenshot({ path: `${name}-${tag}-hero.jpg`, type: 'jpeg', quality: 70 });
                  await p.screenshot({ path: `${name}-${tag}-full.jpg`, type: 'jpeg', quality: 55, fullPage: true, clip: undefined }).catch(()=>{});
                } catch (e) { console.log('FAIL', name, tag, e.message); }
                await ctx.close();
              }
            }
            await b.close();
          })();
JS
          node shot.js \
            prefa=https://www.prefa.com/ \
            rheinzink=https://www.rheinzink.com/ \
            artisan=https://artisanroofing.ca/ \
            heidler=https://heidlerroofing.com/ \
            bonedry=https://bonedry.com/ \
            premier=https://premier-roofing.com/ \
            mightydog=https://mightydogroofing.com/ \
            grasshopper=https://grasshopperroofing.com/ \
            shinglesavers=https://shinglesaversllc.com/ \
            findlay=https://findlayroofing.com/ \
            schulte=https://www.schulteroofing.com/ \
            certified=https://certifiedroofingsolutionsllc.com/ \
            braas=https://www.braas.de/ \
            velux=https://www.velux.com/
          rm -rf node_modules package*.json shot.js
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _ref
          git commit -m "tmp: ref shots" || true
          git push

name: tmp-tetopro-kepek
on:
  push:
    branches: [tmp-tetopro-kepek]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Screenshots
        run: |
          mkdir -p _ref && cd _ref
          npm init -y > /dev/null
          npm i playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cp ../_tools/shot.js .
          node shot.js prefa=https://www.prefa.com/ rheinzink=https://www.rheinzink.com/ artisan=https://artisanroofing.ca/ heidler=https://heidlerroofing.com/ bonedry=https://bonedry.com/ premier=https://premier-roofing.com/ mightydog=https://mightydogroofing.com/ grasshopper=https://grasshopperroofing.com/ shinglesavers=https://shinglesaversllc.com/ findlay=https://findlayroofing.com/ schulte=https://www.schulteroofing.com/ malarkey=https://www.malarkeyroofing.com/ braas=https://www.braas.de/ velux=https://www.velux.com/
          rm -rf node_modules package*.json shot.js
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _ref
          git commit -m "tmp: ref shots" || true
          git push

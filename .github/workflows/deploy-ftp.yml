name: Deploy to daekon.hu (FTP)

on:
  push:
    branches: [master, claude/youthful-faraday-y19v80]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Hiányzik az FTP_PASSWORD secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ftp

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: we002.tarhely.com
          port: 21
          protocol: ftp
          username: ${{ vars.FTP_USERNAME || 'admin@daekon.hu' }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # webes gyökér a szerveren — felülírható a FTP_SERVER_DIR repo-változóval
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
